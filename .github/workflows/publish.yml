# Builds the blog and puts it online with GitHub Pages.
# Runs whenever you change something, and every hour so that
# scheduled posts go live on their own once their date arrives.
name: Publish blog

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"   # every hour, at 17 minutes past
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
