---
layout: default
---
<article class="post">
  <header class="post-head">
    <h1>{{ page.title }}</h1>
  </header>
  {%- if page.image -%}
  <img class="cover-img" src="{{ page.image | relative_url }}" alt="{{ page.image_alt | default: page.title | escape }}">
  {%- endif -%}
  <div class="prose">
    {{ content }}
  </div>
</article>
